<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tarefas de Casa</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#2b6cb0">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background:#f5f5f5; color:#222; }
  h1 { font-size: 1.3rem; margin-bottom: 8px; }
  #user-select { margin-bottom: 16px; display:flex; align-items:center; gap:8px; }
  #user-select select { padding:6px; flex:1; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { flex:1; padding:10px; border:none; border-radius:6px; background:#ddd; font-size:.95rem; }
  .tabs button.active { background:#2b6cb0; color:#fff; }
  .card { background:#fff; border-radius:8px; padding:12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .card.overdue { border-left:4px solid #e53e3e; }
  .card h3 { margin:0 0 4px; font-size:1.05rem; }
  .card p { margin:4px 0; font-size:.9rem; color:#444; }
  .card .meta { font-size:.8rem; color:#777; margin-top:4px; }
  .card button { margin-top:10px; padding:8px 12px; border:none; border-radius:6px; background:#38a169; color:#fff; }
  .empty { color:#888; text-align:center; padding:24px 0; font-size:.9rem; }
  #leaderboard { display:flex; gap:8px; margin-bottom:12px; }
  #leaderboard .score { flex:1; background:#fff; border-radius:8px; padding:10px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  #leaderboard .score .name { font-size:.8rem; color:#666; }
  #leaderboard .score .pts { font-size:1.3rem; font-weight:bold; color:#2b6cb0; }
  form { background:#fff; padding:14px; border-radius:8px; margin-top:20px; display:flex; flex-direction:column; gap:10px; }
  form h3 { margin:0 0 4px; }
  input, select, textarea { padding:10px; font-size:1rem; border:1px solid #ccc; border-radius:6px; width:100%; }
  form button[type=submit] { padding:12px; background:#2b6cb0; color:#fff; border:none; border-radius:6px; font-size:1rem; }
</style>
</head>
<body>
  <div id="user-select">
    <label for="who">Quem é você?</label>
    <select id="who"></select>
  </div>

  <h1>Tarefas</h1>
  <div id="leaderboard"></div>
  <div class="tabs">
    <button data-type="casa" class="active">🏠 Casa</button>
    <button data-type="conta">💰 Contas</button>
  </div>
  <div id="list"></div>

  <form id="task-form">
    <h3>Nova tarefa</h3>
    <input id="title" placeholder="Título *" required>
    <textarea id="description" placeholder="Descrição (opcional)" rows="2"></textarea>
    <input id="due_date" type="date" required>
    <select id="due_time" required></select>
    <input id="points" type="number" min="0" step="1" placeholder="Pontos *" required>
    <select id="assigned_to"></select>
    <button type="submit">Criar tarefa</button>
  </form>

  <script src="/app.js"></script>
</body>
</html>
